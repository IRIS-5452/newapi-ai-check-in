name: MCII 自动签到

on:
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run MCII check-in
        env:
          MCII_ACCOUNTS: ${{ secrets.MCII_ACCOUNTS }}
          MCII_USERNAME: ${{ secrets.MCII_USERNAME }}
          MCII_PASSWORD: ${{ secrets.MCII_PASSWORD }}
          REPORT_URL: ${{ secrets.REPORT_URL }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
        run: python mcii/mcii_checkin.py
